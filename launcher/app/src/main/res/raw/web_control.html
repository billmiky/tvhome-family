<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Home</title>
<style>
  :root {
    --bg: #000; --card: #15171c; --line: #2a2d34; --text: #f2f2f2; --mid: #a3a6ad; --accent: #fff;
    --ok: #4cd787; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 "Outfit", ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px 40px;
  }
  h1 { font-weight: 300; font-size: 28px; margin: 8px 4px 20px; letter-spacing: -0.02em; }
  h2 { font-weight: 500; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mid); margin: 28px 4px 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row label { flex: 1; }
  .row input[type=text] {
    flex: 1.4; min-width: 0; background: #0b0c0f; color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 11px; font: inherit;
  }
  .switch { position: relative; width: 50px; height: 30px; flex: none; }
  /* The real checkbox covers the whole switch, invisible, so a tap anywhere on it toggles. */
  .switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; z-index: 1; cursor: pointer; }
  .switch span { position: absolute; inset: 0; background: #3a3d44; border-radius: 15px; transition: background .2s; }
  .switch span::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
    background: #fff; transition: transform .2s;
  }
  .switch input:checked + span { background: var(--ok); }
  .switch input:checked + span::after { transform: translateX(20px); }
  button, .button {
    background: #fff; color: #000; border: 0; border-radius: 22px; padding: 11px 18px; font: inherit;
    font-weight: 500; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button:disabled { opacity: .45; }
  .bar { display: flex; gap: 10px; flex-wrap: wrap; padding: 14px 16px; }
  .bar > * { flex: 1; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; padding: 0 16px 16px; }
  .tile { position: relative; aspect-ratio: 16 / 9; background: #0b0c0f; border-radius: 10px; overflow: hidden; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile button {
    position: absolute; top: 5px; right: 5px; padding: 3px 9px; font-size: 13px; border-radius: 12px;
    background: rgba(0,0,0,.6); color: #fff;
  }
  .note { color: var(--mid); font-size: 13px; padding: 0 16px 14px; }
  #status { position: fixed; left: 16px; right: 16px; bottom: 16px; padding: 12px 16px; border-radius: 14px;
    background: #fff; color: #000; font-weight: 500; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #status.show { opacity: 1; }
  #status.bad { background: var(--bad); color: #fff; }
  input[type=file] { display: none; }
  .occ { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .occ:first-child { border-top: 0; }
  .occ .when { color: var(--mid); font-size: 13px; min-width: 64px; font-variant-numeric: tabular-nums; }
  .occ .what { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .occ button { padding: 4px 11px; font-size: 13px; }
  .add { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 14px 16px; border-top: 1px solid var(--line); }
  .add input[type=date], .add input[type=text], .add input[type=url] {
    min-width: 0; background: #0b0c0f; color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 11px; font: inherit; color-scheme: dark;
  }
  .add input[type=text], .add input[type=url] { grid-column: 1 / -1; }
  .add label { display: flex; align-items: center; gap: 8px; color: var(--mid); font-size: 14px; }
  .add button { grid-column: 1 / -1; }
  .seg { display: flex; gap: 8px; padding: 14px 16px 0; }
  .seg button { flex: 1; padding: 8px 12px; }
  .seg button:not(.on) { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .total { padding: 14px 16px 4px; font-size: 34px; font-weight: 300; letter-spacing: -0.02em; }
  .total small { display: block; font-size: 13px; color: var(--mid); letter-spacing: 0; }
  .chart { display: flex; align-items: flex-end; gap: 3px; height: 120px; padding: 8px 16px 0; }
  .chart div { flex: 1; background: #fff; border-radius: 3px 3px 0 0; min-height: 2px; opacity: .85; }
  .ticks { display: flex; gap: 3px; padding: 4px 16px 12px; color: var(--mid); font-size: 11px; }
  .ticks span { flex: 1; text-align: center; overflow: hidden; }
  .app { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 16px; border-top: 1px solid var(--line); }
  .app .len { color: var(--mid); font-variant-numeric: tabular-nums; }
  .app .fill { grid-column: 1 / -1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .app .fill i { display: block; height: 100%; background: var(--ok); }
</style>
</head>
<body>
<h1>Home</h1>

<h2>Screen time</h2>
<div class="card">
  <div class="seg"><button id="r24" class="on">24 hours</button><button id="r7">7 days</button></div>
  <div id="report"></div>
</div>

<h2>Switches</h2>
<div class="card">
  <div class="row"><label for="gallery">Gallery photos</label><span class="switch"><input type="checkbox" id="gallery"><span></span></span></div>
  <div class="row"><label for="btc">Bitcoin price</label><span class="switch"><input type="checkbox" id="btc"><span></span></span></div>
  <div class="row"><label for="weather">Weather</label><span class="switch"><input type="checkbox" id="weather"><span></span></span></div>
  <div class="row"><label for="now_playing">Now playing</label><span class="switch"><input type="checkbox" id="now_playing"><span></span></span></div>
  <div class="row"><label for="holidays">Built-in holidays (Tết, New Year)</label><span class="switch"><input type="checkbox" id="holidays"><span></span></span></div>
  <div class="row"><label for="greeting">Greeting name</label><input type="text" id="greeting" maxlength="40" placeholder="Mr. Trịnh" autocomplete="off"></div>
  <div class="row"><label for="weather_location">Weather place</label><input type="text" id="weather_location" maxlength="80" placeholder="Singapore or 1.29,103.85" autocomplete="off"></div>
</div>

<h2>Occasions</h2>
<div class="card">
  <div id="occList"></div>
  <form class="add" id="occForm">
    <input type="date" id="occDate" required>
    <label><input type="checkbox" id="occYearly" checked> Every year</label>
    <input type="text" id="occText" maxlength="120" placeholder="Happy birthday, Phúc 🥳 🎁" autocomplete="off" required>
    <input type="url" id="occVideo" maxlength="200" placeholder="YouTube link (optional)" autocomplete="off">
    <button type="submit">Add</button>
  </form>
  <p class="note">On that day the line above the clock shows this instead of the greeting, and a Play card
    plays the YouTube link (a birthday without one plays a Happy Birthday song).</p>
</div>

<h2>Photos</h2>
<div class="card">
  <div class="bar">
    <button class="ghost" id="prev">‹ Previous</button>
    <button class="ghost" id="next">Next ›</button>
  </div>
  <div class="bar">
    <label class="button" for="files">Add photos</label>
    <input type="file" id="files" accept="image/jpeg,image/png,image/webp" multiple>
  </div>
  <p class="note" id="photoNote"></p>
  <div class="grid" id="grid"></div>
</div>

<div id="status"></div>

<script>
(() => {
  const H = { 'X-Requested-With': 'tvhome' };
  const $ = id => document.getElementById(id);
  let timer;
  let occasions = [];

  function say(text, bad) {
    const s = $('status');
    s.textContent = text;
    s.className = 'show' + (bad ? ' bad' : '');
    clearTimeout(timer);
    timer = setTimeout(() => { s.className = ''; }, 2600);
  }

  async function call(method, path, body, headers) {
    const r = await fetch(path, { method, body, headers: Object.assign({}, H, headers || {}), credentials: 'same-origin' });
    let data = {};
    try { data = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error(data.error || ('Error ' + r.status));
    return data;
  }

  function render(s) {
    for (const k of ['gallery', 'btc', 'weather', 'now_playing', 'holidays']) $(k).checked = !!s[k];
    occasions = s.occasions || [];
    const list = $('occList');
    list.textContent = '';
    if (!occasions.length) {
      const empty = document.createElement('div');
      empty.className = 'occ';
      empty.innerHTML = '<span class="what" style="color:var(--mid)">No occasions yet.</span>';
      list.appendChild(empty);
    }
    occasions.forEach((o, i) => {
      const row = document.createElement('div');
      row.className = 'occ';
      const when = document.createElement('span');
      when.className = 'when';
      // "03-14" every year, "2027-03-14" once.
      when.textContent = o.date.length === 5 ? o.date.replace('-', '/') + ' ↻' : o.date;
      const what = document.createElement('span');
      what.className = 'what';
      // ▶ marks an occasion with its own video.
      what.textContent = o.video ? o.text + '  ▶' : o.text;
      if (o.video) what.title = 'youtu.be/' + o.video;
      const del = document.createElement('button');
      del.className = 'ghost';
      del.textContent = 'Remove';
      del.addEventListener('click', () => saveOccasions(occasions.filter((_, j) => j !== i)));
      row.append(when, what, del);
      list.appendChild(row);
    });
    for (const k of ['greeting', 'weather_location']) if (document.activeElement !== $(k)) $(k).value = s[k] || '';
    $('prev').disabled = $('next').disabled = !s.home;
    const grid = $('grid');
    grid.textContent = '';
    $('photoNote').textContent = s.photos.length
      ? s.photos.length + ' photo' + (s.photos.length === 1 ? '' : 's') + ' in Pictures/Launcher.'
        + (s.home ? '' : ' Previous / Next work while Home is on screen.')
      : 'No photos yet.';
    for (const p of s.photos) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.alt = p.name;
      img.src = '/thumb?id=' + encodeURIComponent(p.id);
      tile.appendChild(img);
      const del = document.createElement('button');
      del.textContent = '✕';
      del.title = p.own ? 'Delete' : 'Added from a computer, can\'t delete here';
      del.addEventListener('click', async () => {
        if (!p.own) { say('Added from a computer, can\'t delete it here', true); return; }
        if (!confirm('Delete ' + p.name + '?')) return;
        try { await call('POST', '/api/delete?id=' + encodeURIComponent(p.id)); say('Deleted'); load(); }
        catch (e) { say(e.message, true); }
      });
      tile.appendChild(del);
      grid.appendChild(tile);
    }
  }

  async function load() {
    try { render(await call('GET', '/api/state')); } catch (e) { say(e.message, true); }
  }

  async function save(patch) {
    try { render(await call('POST', '/api/settings', JSON.stringify(patch), { 'Content-Type': 'application/json' })); say('Saved'); }
    catch (e) { say(e.message, true); load(); }
  }

  async function saveOccasions(next) {
    try {
      render(await call('POST', '/api/occasions', JSON.stringify({ occasions: next }), { 'Content-Type': 'application/json' }));
      say('Saved');
    } catch (e) { say(e.message, true); load(); }
  }

  $('occForm').addEventListener('submit', ev => {
    ev.preventDefault();
    const d = $('occDate').value;           // YYYY-MM-DD
    const text = $('occText').value.trim();
    if (!d || !text) return;
    // Counted in characters as the TV counts them: an emoji is one, not two.
    if ([...text].length > 48) { say('At most 48 characters', true); return; }
    const date = $('occYearly').checked ? d.slice(5) : d;
    const video = $('occVideo').value.trim();
    const entry = video ? { date, text, video } : { date, text };
    $('occText').value = '';
    $('occVideo').value = '';
    saveOccasions(occasions.concat([entry]));
  });

  for (const k of ['gallery', 'btc', 'weather', 'now_playing', 'holidays']) {
    $(k).addEventListener('change', () => save({ [k]: $(k).checked }));
  }
  for (const k of ['greeting', 'weather_location']) {
    $(k).addEventListener('change', () => save({ [k]: $(k).value }));
  }
  for (const [id, dir] of [['prev', 'prev'], ['next', 'next']]) {
    $(id).addEventListener('click', async () => {
      try { await call('POST', '/api/photo?dir=' + dir); } catch (e) { say(e.message, true); }
    });
  }

  $('files').addEventListener('change', async ev => {
    const files = Array.from(ev.target.files || []).slice(0, 20);
    ev.target.value = '';
    let done = 0;
    for (const f of files) {
      if (f.size > 15 * 1024 * 1024) { say(f.name + ' is over 15 MB', true); continue; }
      say('Uploading ' + (done + 1) + ' of ' + files.length + '…');
      try {
        await call('POST', '/api/upload', f, { 'Content-Type': 'application/octet-stream', 'X-Filename': encodeURIComponent(f.name) });
        done++;
      } catch (e) { say(f.name + ': ' + e.message, true); }
    }
    if (done) say(done + ' photo' + (done === 1 ? '' : 's') + ' added');
    load();
  });

  function dur(ms) {
    const m = Math.floor(ms / 60000);
    return m < 60 ? m + 'm' : Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm';
  }

  let range = '24h';
  async function loadReport() {
    $('r24').className = range === '24h' ? 'on' : '';
    $('r7').className = range === '7d' ? 'on' : '';
    const box = $('report');
    let r;
    try { r = await call('GET', '/api/report?range=' + range); } catch (e) { say(e.message, true); return; }
    box.textContent = '';
    if (!r.allowed) {
      const n = document.createElement('div');
      n.className = 'note';
      n.style.paddingTop = '14px';
      n.textContent = 'Needs usage access: run build-and-install.sh again, or adb shell appops set com.gathin.tvhome GET_USAGE_STATS allow';
      box.appendChild(n);
      return;
    }
    const total = document.createElement('div');
    total.className = 'total';
    total.textContent = dur(r.total);
    const sub = document.createElement('small');
    sub.textContent = range === '24h' ? 'TV on in the last 24 hours' : 'TV on in the last 7 days';
    total.appendChild(sub);
    box.appendChild(total);
    const max = Math.max(1, ...r.buckets);
    const chart = document.createElement('div');
    chart.className = 'chart';
    const ticks = document.createElement('div');
    ticks.className = 'ticks';
    r.buckets.forEach((v, i) => {
      const b = document.createElement('div');
      b.style.height = Math.round(v / max * 100) + '%';
      b.title = r.labels[i] + ': ' + dur(v);
      chart.appendChild(b);
      const t = document.createElement('span');
      t.textContent = range === '7d' || i % 3 === 0 ? r.labels[i] : '';
      ticks.appendChild(t);
    });
    box.appendChild(chart);
    box.appendChild(ticks);
    const top = Math.max(1, ...r.apps.map(a => a.ms));
    for (const a of r.apps) {
      const row = document.createElement('div');
      row.className = 'app';
      const name = document.createElement('span');
      name.textContent = a.name;
      const len = document.createElement('span');
      len.className = 'len';
      len.textContent = dur(a.ms);
      const fill = document.createElement('div');
      fill.className = 'fill';
      const bar = document.createElement('i');
      bar.style.width = Math.round(a.ms / top * 100) + '%';
      fill.appendChild(bar);
      row.append(name, len, fill);
      box.appendChild(row);
    }
  }
  $('r24').addEventListener('click', () => { range = '24h'; loadReport(); });
  $('r7').addEventListener('click', () => { range = '7d'; loadReport(); });

  load();
  loadReport();
})();
</script>
</body>
</html>
